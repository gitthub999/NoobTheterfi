name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build pydroid 30.0.0 to mavenLocal + local-repo
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/pyamsoft/pydroid.git /tmp/pydroid
          cd /tmp/pydroid
          git fetch --tags --depth 1 origin
          git checkout 30.0.0 || git checkout v30.0.0 || git checkout main
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache -Dorg.gradle.parallel=false
          cd ${{ github.workspace }}
          mkdir -p local-repo/com/pyamsoft
          cp -r ~/.m2/repository/com/pyamsoft/pydroid local-repo/com/pyamsoft/ || cp -r /home/runner/.m2/repository/com/pyamsoft/pydroid local-repo/com/pyamsoft/
          echo "=== local-repo created ==="
          ls -lh local-repo/com/pyamsoft/pydroid/ | head -30

      - name: Build TetherFi APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetherFuseNet-APK
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - name: Upload local-repo + APK to GitHub repo
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f local-repo/
          git add -f app/build/outputs/apk/fdroid/debug/*.apk || true
          git commit -m "vendor local-repo + apk for offline" || echo "already committed"
          git push
