name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build pydroid 30.0.0 to mavenLocal
        run: |
          git clone https://github.com/pyamsoft/pydroid.git /tmp/pydroid
          cd /tmp/pydroid
          git checkout 30.0.0 || git checkout main
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache -Dorg.gradle.parallel=false

      - name: Build TetherFi APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TetherFuseNet-APK
          path: app/build/outputs/apk/fdroid/debug/*.apk
