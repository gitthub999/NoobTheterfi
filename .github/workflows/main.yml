name: OFFLINE VENDOR 1ST TIME
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Vendor pydroid to local-repo
        run: |
          git clone --depth 1 --branch 30.0.0 https://github.com/pyamsoft/pydroid.git pydroid-30.0.0
          cd pydroid-30.0.0
          chmod +x gradlew
          ./gradlew publish -PpublishUrl=file://${{ github.workspace }}/local-repo --no-configuration-cache -Dorg.gradle.parallel=false
          cd ..
          rm -rf pydroid-30.0.0 .gradle

      - name: Commit ALL to make offline
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f local-repo
          git commit -m "offline vendor done" || echo "nothing"
          git push
