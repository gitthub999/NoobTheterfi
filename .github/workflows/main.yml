name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build pydroid + create local-repo
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/pyamsoft/pydroid.git /tmp/pydroid
          cd /tmp/pydroid
          git fetch --tags --depth 1 origin
          git checkout 30.0.0 || git checkout v30.0.0 || git checkout main
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-configuration-cache -Dorg.gradle.parallel=false
          cd ${{ github.workspace }}
          mkdir -p local-repo
          cp -r ~/.m2/repository/. local-repo/
          ls local-repo | head -20

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-configuration-cache

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetherFuseNet-APK
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - name: Push local-repo to repo
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -f local-repo/
          git add -f app/build/outputs/apk/fdroid/debug/*.apk || true
          git commit -m "vendor all + apk" || true
          git push
