name: 1ST TIME - BUILD AND VENDOR + APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 1. Vendor pydroid to local-repo
        run: |
          git clone https://github.com/pyamsoft/pydroid.git pydroid-30.0.0
          cd pydroid-30.0.0
          git checkout tags/30.0.0
          chmod +x gradlew
          ./gradlew publish -PpublishUrl=file://${{ github.workspace }}/local-repo --no-configuration-cache -Dorg.gradle.parallel=false
          cd ..
          rm -rf pydroid-30.0.0 .gradle
          ls -lh local-repo/com/pyamsoft/pydroid/ | head -20

      - name: 2. Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --no-configuration-cache

      - name: 3. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TTT-APK
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - name: 4. Upload local-repo + APK to GitHub
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git rm -r --cached local-repo || true
          git add -f local-repo/
          git add -f app/build/outputs/apk/fdroid/debug/*.apk
          git commit -m "local-repo + apk uploaded for offline" || echo "nothing"
          git push
